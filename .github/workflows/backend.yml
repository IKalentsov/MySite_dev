# Backend build and test. The commands are the ones WORKFLOW.md documents, run from backend/,
# where global.json selects the Microsoft.Testing.Platform runner.
#
# The integration tests start their own PostgreSQL container through Testcontainers, so the
# runner needs a working Docker daemon; GitHub-hosted runners provide one.
name: Backend

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore MySite.slnx

      - name: Build
        run: dotnet build MySite.slnx --no-restore -c Debug

      - name: Test
        run: dotnet test MySite.slnx -c Debug

      # The schema is committed and the frontend is generated from it, so a
      # contract change that skipped the regeneration fails here.
      #
      # The connection string only has to be non-empty: the document generator
      # runs the app's entrypoint, and AddInfrastructure rejects an empty value.
      # Nothing connects to a database.
      - name: Check the committed OpenAPI document is current
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5433;Database=MySite;Username=build;Password=build
        run: |
          dotnet build src/MySite.Web/MySite.Web.csproj --no-restore -p:OpenApiGenerateDocumentsOnBuild=true
          git diff --exit-code -- docs/openapi.json
