# Local PostgreSQL for development, shaped after the DirectoryService project's compose file.
#
# Two deliberate differences from that template:
#   * no `container_name` — the template pins the name `postgres`, which collides with the
#     container of that name another project already owns, and two projects can then never run
#     at the same time. Letting Compose name the container keeps projects independent.
#   * the image tag is pinned — `postgres` alone floats to a new major version, and the volume
#     below is bound to the 18 layout, so a floating tag would eventually refuse to start.
services:
  postgres:
    image: postgres:18.6-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    # A distinct host port, as in the DirectoryService template: 5432 is taken by the native
    # PostgreSQL service installed on this machine, and Windows resolves `localhost` to ::1
    # first, so a container published on 5432 is simply never reached.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker

volumes:
  postgres-data:
