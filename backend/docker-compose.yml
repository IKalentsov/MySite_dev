# Local PostgreSQL for development, shaped after the DirectoryService project's compose file:
# credentials come from .env, the container restarts itself, the volume is mounted at the image's
# own PGDATA, and the host port is its own — so the container shows up in a database client as a
# server of its own, next to the native PostgreSQL installation and next to directory_server.
#
# Two points where this file deliberately differs from that template:
#   * the container name is `mysite_postgres`, not the template's generic `postgres` — that name
#     is already taken by another project's container, and with it two projects can never run at
#     the same time;
#   * the image tag is pinned — `postgres` alone floats to a new major version, and the volume
#     below is bound to the 18 layout, so a floating tag would eventually refuse to start.
services:
  postgres:
    container_name: mysite_postgres
    image: postgres:18.6-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    # A distinct host port, as in the DirectoryService template: 5432 is taken by the native
    # PostgreSQL service installed on this machine, and Windows resolves `localhost` to ::1
    # first, so a container published on 5432 is simply never reached.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker

volumes:
  postgres-data:
