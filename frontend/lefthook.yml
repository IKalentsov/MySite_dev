# One root config for the frontend monorepo (ticket 10 chose lefthook over
# lint-staged because lint-staged's per-package configs do not merge).
#
# The types job runs `tsc --noEmit` over the whole project, not over the staged
# files: TypeScript ignores tsconfig.json when input files are passed, so a
# changed-files check would either drop the project configuration or miss
# cross-file breakage (ticket 10). The glob only decides *whether* to run it.
pre-commit:
  parallel: false
  jobs:
    - name: lint
      root: "frontend/"
      glob: "*.{js,mjs,cjs,ts,tsx}"
      # --no-warn-ignored: the file list is the staged set, and it may include a
      # file the flat config ignores on purpose (the generated API client types).
      # ESLint then warns that it ignored an explicitly passed file; the warning is
      # about the invocation, not about the code, and --max-warnings=0 turns it
      # into a failed commit. Ignored files stay ignored; no rule is relaxed.
      run: pnpm exec eslint --max-warnings=0 --no-warn-ignored {staged_files}
    - name: typecheck
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
